<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photodex</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animals.css">
    <link rel="stylesheet" href="css/sizeslider.css">
</head>
<body>
    <script src="js/navbar.js"></script>

    <h1>Oiseaux</h1>
    
    
    <!-- ######################### PROGRESS BAR ######################### -->

    <section id="progress-bar">

    </section>
    <script type="module" src="js/objectives.js"></script>

    
    <!-- ######################### FILTRES ######################### -->
    
    <div id="filters">
        <div class="filter">
            <label for="search-input">Chercher un animal par mot-clé</label>
            <input id="search-input" type="text" placeholder="...">
        </div>
        
        <div class="filter">
            <label for="order">Ordre d'affichage :</label>
            <select name="order" id="order">
                <option value="alpha">Ordre Alphabétique</option>
                <option value="lastseen">Par date d'Observation</option>
            </select>
        </div>

        <div class="filter">
            <label for="direction">Inverser</label>
            <input type="checkbox" id="direction" name="direction"/>
        </div>

        <div class="filter">
            <label for="enable-size-filter">Filtrer par taille</label>
            <input type="checkbox" id="enable-size-filter" name="enable-size-filter">
        </div>

    </div>
    <div id="size-slider">
        <label for="size-filter">Gabarit : <strong id="size-label">Mésange</strong></label><br>
        <input id="size-filter" type="range" min="0" max="7" value="0" step="1">
        <div id="size-references"></div>
    </div>


    <!-- ######################### ANIMAL CARDS ######################### -->
    
    <section id="animals-container">
    </section>
    
    <script type="module" src="js/app.js"></script>


    <!-- ######################### FOOTER ######################### -->
    
    <footer>
      <div class="container">
          <p>&copy; 2026 Photodex. Tous droits réservés.</p>
      </div>
  </footer>
</body>
</html>
